[tools]
cosign        = "3.1.2"
go            = "latest"
golangci-lint = "latest"
goreleaser    = "latest"
just          = "latest"

[settings]
activate_aggressive = true
env_cache           = true
exec_auto_install   = true
github_attestations = true
lockfile            = true
pin                 = true
slsa                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
