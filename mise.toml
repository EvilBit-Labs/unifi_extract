[tools]
cosign                                 = "3.1.4"
go                                     = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint                          = "2.15.0"
goreleaser                             = "2.20.2"
just                                   = "1.59.0"
"pipx:pre-commit"                      = "4.7.0"

[settings]
activate_aggressive = true
env_cache           = true
exec_auto_install   = true
github_attestations = true
lockfile            = true
pin                 = true
slsa                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
