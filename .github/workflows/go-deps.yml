name: Go Dependency Submission
on:
  push:
    branches:
      - main

# Least privilege: top-level read-only; the submission job elevates to
# contents: write, which the Dependency Graph submission API requires.
permissions:
  contents: read

jobs:
  go-action-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to submit the dependency snapshot to the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run snapshot action
        uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921 # v2.0.3
        with:
          go-mod-path: go.mod
