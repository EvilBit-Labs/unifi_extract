name: Feature Request
description: Suggest a new capability or enhancement for unifi-extract
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. unifi-extract is a focused, offline
        UniFi backup inspection tool — proposals that sharpen that core value are
        the most likely to land. Please describe the problem before the solution.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched [existing issues](https://github.com/EvilBit-Labs/unifi_extract/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: This request is in scope for an offline backup inspection tool (not controller management, and nothing requiring network access).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected and when?
      placeholder: "As an operator inspecting a backup, I can't ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you envision this working, including CLI flags or output changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you rejected them.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Sample (redacted) output, related tools, or references.
    validations:
      required: false
